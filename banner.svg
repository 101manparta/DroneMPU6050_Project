<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />
  
  <!-- Subtle grid pattern -->
  <path d="M0 150 L1200 150 M600 0 L600 300" stroke="#334155" stroke-width="1" opacity="0.3" />
  <path d="M300 0 L300 300 M900 0 L900 300" stroke="#334155" stroke-width="1" opacity="0.2" />
  
  <!-- Drone Body -->
  <g transform="translate(600, 150)">
    <!-- Center body -->
    <rect x="-35" y="-8" width="70" height="16" rx="4" fill="#1e293b" stroke="#00d4ff" stroke-width="2" />
    
    <!-- Arms -->
    <rect x="-90" y="-3" width="60" height="6" rx="2" fill="#0f172a" stroke="#00d4ff" stroke-width="1" transform="rotate(0)" />
    <rect x="30" y="-3" width="60" height="6" rx="2" fill="#0f172a" stroke="#00d4ff" stroke-width="1" transform="rotate(0)" />
    <rect x="-3" y="-90" width="6" height="60" rx="2" fill="#0f172a" stroke="#00d4ff" stroke-width="1" transform="rotate(0)" />
    <rect x="-3" y="30" width="6" height="60" rx="2" fill="#0f172a" stroke="#00d4ff" stroke-width="1" transform="rotate(0)" />
    
    <!-- Motors -->
    <circle cx="-75" cy="0" r="8" fill="#ef4444" />
    <circle cx="75" cy="0" r="8" fill="#ef4444" />
    <circle cx="0" cy="-75" r="8" fill="#ef4444" />
    <circle cx="0" cy="75" r="8" fill="#ef4444" />
    
    <!-- Propellers -->
    <rect x="-79" y="-2" width="8" height="4" fill="#00d4ff" opacity="0.6" />
    <rect x="71" y="-2" width="8" height="4" fill="#00d4ff" opacity="0.6" />
    <rect x="-2" y="-79" width="4" height="8" fill="#00d4ff" opacity="0.6" />
    <rect x="-2" y="71" width="4" height="8" fill="#00d4ff" opacity="0.6" />
  </g>
  
  <!-- Sensor Icons (MPU6050 + HMC5883L) -->
  <g transform="translate(150, 150)">
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="#1e293b" stroke="#00d4ff" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#00d4ff" opacity="0.2" />
    <path d="M-10,-5 L10,-5 L0,5 Z" fill="#00d4ff" />
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">MPU6050</text>
  </g>
  
  <g transform="translate(1050, 150)">
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="#1e293b" stroke="#00d4ff" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#00d4ff" opacity="0.2" />
    <path d="M-8,-8 L8,-8 L8,8 L-8,8 Z" fill="#00d4ff" />
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">HMC5883L</text>
  </g>
  
  <!-- Mathematical Formulas -->
  <text x="100" y="80" font-family="Courier New, monospace" font-size="14" fill="#38bdf8" text-anchor="start">R = Rz(yaw) × Ry(pitch) × Rx(roll)</text>
  <text x="100" y="110" font-family="Courier New, monospace" font-size="14" fill="#38bdf8" text-anchor="start">x = [roll, pitch, yaw, bias_gx, bias_gy, bias_gz]</text>
  <text x="100" y="140" font-family="Courier New, monospace" font-size="14" fill="#38bdf8" text-anchor="start">jarak = (c × t) / 2</text>
  <text x="100" y="170" font-family="Courier New, monospace" font-size="14" fill="#38bdf8" text-anchor="start">c = 299.792.458 m/s</text>
  
  <!-- Title Text (for GitHub social preview, optional overlay) -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">DroneMPU6050_Project</text>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">EKF • Magnetometer • 3D Visualization • C++ • Arduino</text>
</svg>